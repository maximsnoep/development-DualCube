[workspace]
resolver = "3"
members = [
    "crates/dualcube",
    "crates/dualcube-dual",
    "crates/dualcube-flow",
    "crates/dualcube-hex",
    "crates/dualcube-io",
    "crates/dualcube-primal",
    "crates/dualcube-quad",
    "crates/dualcube-types",
    "crates/grapff",
    "crates/mehsh",
    "crates/mehsh-tetgen",
    "crates/bevy-orbit-camera",
    "crates/bevy-axes-gizmo",
    "crates/bevy-toon",
    "crates/bevy-wicon",
    "apps/cli",
    "apps/gui",
]

# The license of every crate (see LICENSE).
[workspace.package]
license = "MIT"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }

# Optimized and quick to rebuild (incremental): for iterating (`cargo rel`).
[profile.release]
opt-level = 3
lto = false
incremental = true
codegen-units = 16
debug = 0
strip = "debuginfo"

# The fastest runtime, slow to build (`cargo max`): whole-program optimization.
[profile.max]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[profile.profiling]
inherits = "release"
codegen-units = 16
debug = 2
strip = false

# Quickest to compile (`cargo dev`): the workspace crates are not optimized, the dependencies are (they are compiled
# once and cached).
[profile.dev]
opt-level = 0
lto = false
incremental = true
codegen-units = 16
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unnameable_types = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"  # sometimes good to name what you are returning
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"
