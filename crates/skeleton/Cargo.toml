[package]
name = "skeleton"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Data types and implementation for skeleton-based initialization for arbitrary genus surfaces."

[dependencies]
skeleton-numerics = { path = "../skeleton-numerics" }
dualcube-dual = { path = "../dualcube-dual" }
dualcube-flow = { path = "../dualcube-flow" }
dualcube-types = { path = "../dualcube-types" }
faer.workspace = true
mehsh.workspace = true
mehsh-tetgen.workspace = true
nalgebra.workspace = true
petgraph.workspace = true
rustc-hash = "2.1.1"
serde = { workspace = true, features = ["derive"] }
slotmap = { workspace = true, features = ["serde"] }
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }

[lints]
workspace = true
