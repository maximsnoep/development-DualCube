[package]
name = "gui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Color schemes of the axes (the default is Nord). The old ones:
old = []
snoep6 = []
bettina = []
gray = []
pastel = []
light_mode = []
hex = ["dep:dualcube-hex"]
nlr = []
rgb = []
# Link Bevy dynamically: faster (re)linking while iterating (`cargo rel`), slower at runtime. Does not link in debug
# builds on Windows (too many exported symbols).
dynamic = ["bevy/dynamic_linking"]

[dependencies]
dualcube = { path = "../../crates/dualcube" }
dualcube-hex = { path = "../../crates/dualcube-hex", optional = true }
io = { path = "../../crates/dualcube-io" }
mehsh = { path = "../../crates/mehsh" }
mehsh-bevy = { path = "../../crates/mehsh-bevy" }

bevy = { workspace = true, features = [

	# Core
    "std",
    "multi_threaded",

    # App/window/input basics
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "keyboard",
    "mouse",

    # Assets/rendering
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "bevy_mesh",
    "bevy_light",
    "bevy_pbr",
    "bevy_shader",

    # Your app uses Gizmos and MeshRayCast
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "mesh_picking",

    # Needed by Bevy UI / bevy_egui interaction
    "bevy_ui",
    "bevy_ui_render",

    # Diagnostics
    "sysinfo_plugin",

    # Windows desktop backend
    "raw_vulkan_init",
] }

# Egui UI
bevy_egui = "0.43.0-rc.1"
# File dialogs
rfd = { version = "0.17.2", default-features = false }

# Bevy plugins
# (Vendored from crates.io and ported along with Bevy, see their manifests.)
bevy-orbit-camera = { path = "../../crates/bevy-orbit-camera" }
bevy-axes-gizmo = { path = "../../crates/bevy-axes-gizmo" }
bevy-toon = { path = "../../crates/bevy-toon" }
bevy-wicon = { path = "../../crates/bevy-wicon" }

[lints]
workspace = true
